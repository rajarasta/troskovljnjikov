[project]
name = "boq-matcher-backend"
version = "0.1.0"
description = "BOQ Matcher backend - FastAPI + PydanticAI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pydantic-ai>=0.0.40",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.18",
    "websockets>=14.0",
    "alembic>=1.14.0",
    "reportlab>=4.0.0",
    "chromadb>=0.6.0",
    "sentence-transformers>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
browser = [
    "playwright>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
